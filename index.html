<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音樂臥底</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f4ece1; color: #4a4036; font-family: 'Noto Sans TC', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #ffffff; padding: 40px; border-radius: 24px; width: 90%; max-width: 480px; box-shadow: 0 15px 35px rgba(139, 115, 85, 0.1); text-align: center; position: relative; overflow: hidden; }
        .container::before { content: ''; position: absolute; top: -40px; left: -40px; width: 140px; height: 140px; background-color: #fff5eb; border-radius: 50%; z-index: 0; }
        .container::after { content: ''; position: absolute; bottom: -30px; right: -30px; width: 100px; height: 100px; background-color: #f0f4f1; border-radius: 50%; z-index: 0; }
        .content-wrapper { position: relative; z-index: 1; }

        h1 { margin-top: 0; margin-bottom: 20px; color: #6b5b4e; font-weight: 900; letter-spacing: 2px; }
        .label { font-size: 14px; font-weight: bold; color: #a39589; margin-bottom: 10px; display: block; }
        input, select { padding: 14px; font-size: 16px; width: 80%; margin-bottom: 20px; border-radius: 12px; border: 2px solid #f2ede4; background: #faf8f5; color: #5a4b41; text-align: center; font-weight: bold; transition: all 0.3s; }
        input:focus, select:focus { outline: none; border-color: #e3a87c; background: #ffffff; }

        button { padding: 14px 28px; font-size: 16px; font-weight: 700; margin: 10px 5px; cursor: pointer; border-radius: 12px; border: none; background-color: #e3a87c; color: white; box-shadow: 0 4px 12px rgba(227, 168, 124, 0.3); transition: all 0.2s; }
        button:hover { background-color: #cf9366; transform: translateY(-2px); }
        .btn-secondary { background-color: #9cbca7; box-shadow: 0 4px 12px rgba(156, 188, 167, 0.3); }
        .btn-secondary:hover { background-color: #84a690; }
        .btn-danger { background-color: #e07a5f; box-shadow: 0 4px 12px rgba(224, 122, 95, 0.3); }
        .btn-danger:hover { background-color: #c9654b; }
        .btn-outline { background-color: transparent; border: 2px solid #e07a5f; color: #e07a5f; box-shadow: none; padding: 6px 12px; font-size: 14px; }
        .btn-outline:hover { background-color: #e07a5f; color: white; }
        .btn-setting { border: 2px solid #9cbca7; color: #9cbca7; }
        .btn-setting:hover { background-color: #9cbca7; color: white; }

        .room-header { border-bottom: 2px dashed #f2ede4; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;}
        #displayRoomId { font-size: 24px; font-weight: 900; color: #cf9366; margin: 0; }
        .room-settings-info { width: 100%; font-size: 14px; color: #a39589; margin-top: 10px; font-weight: bold; }
        
        .player-list-item { font-size: 16px; font-weight: bold; padding: 14px 15px; margin: 8px 0; background: #faf8f5; border-radius: 12px; color: #7a6a5d; border: 1px solid #f2ede4; display: flex; justify-content: center; align-items: center; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(74, 64, 54, 0.6); z-index: 999; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
        .modal-box { background: white; padding: 30px; border-radius: 20px; width: 85%; max-width: 350px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); text-align: center; }
        .modal-msg { margin-bottom: 20px; font-size: 18px; font-weight: bold; color: #6b5b4e; }
        .modal-btns { display: flex; justify-content: center; gap: 15px; }

        #countdownNumber, #voteTimer { font-size: 80px; font-weight: 900; color: #e07a5f; text-shadow: 2px 4px 10px rgba(224, 122, 95, 0.2); margin: 20px 0; }
        .vote-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .vote-btn { padding: 15px; background: #faf8f5; border: 2px solid #f2ede4; border-radius: 12px; font-size: 16px; font-weight: bold; color: #7a6a5d; cursor: pointer; transition: 0.2s; }
        .vote-btn.selected { background: #e07a5f; color: white; border-color: #c9654b; transform: scale(1.05); }

        #resultTitle { font-size: 32px; font-weight: 900; margin-bottom: 15px; }
        
        .song-reveal-box {
            background: #faf8f5; border: 1px solid #f2ede4; border-radius: 12px; 
            padding: 15px; margin-bottom: 15px; text-align: left;
        }
        
        /* 給動態產生的名字一點粗體效果 */
        .eliminated-name { font-weight: bold; }
    </style>
</head>
<body>
    
    <div id="homeScreen" class="container">
        <div class="content-wrapper">
            <h1>音樂臥底</h1>
            <span class="label">輸入暱稱</span>
            <input type="text" id="nameInput" placeholder="預設: 天飛巴庫">
            <div style="margin-top: 5px;"><button onclick="createRoom()">建立房間</button></div>
            <hr style="border: none; border-top: 2px dashed #f2ede4; margin: 30px 0;">
            <div style="display: flex; justify-content: center; gap: 10px; align-items: center;">
                <input type="text" id="roomInput" placeholder="輸入4碼房間代號" style="width: 55%; margin-bottom: 0; text-transform: uppercase;">
                <button class="btn-secondary" style="margin: 0; white-space: nowrap;" onclick="joinRoom()">加入房間</button>
            </div>
        </div>
    </div>

    <div id="roomScreen" class="container" style="display: none;">
        <div class="content-wrapper">
            <div class="room-header">
                <h2 id="displayRoomId">房間：</h2>
                <div>
                    <button id="settingBtn" class="btn-outline btn-setting" style="display: none;" onclick="openSettings()">遊戲設定</button>
                    <button id="leaveBtn" class="btn-outline" onclick="leaveRoom()">退出房間</button>
                </div>
                <div class="room-settings-info" id="displaySettings">設定：15秒 | 混合隨機</div>
            </div>
            <div id="playerList" style="margin: 20px 0; min-height: 150px;"></div>
            <div style="margin-top: 30px;">
                <button id="readyBtn" onclick="toggleReady()">準備 / 取消</button>
                <button id="startBtn" class="btn-danger" style="display: none;" onclick="startGame()">開始遊戲</button>
            </div>
        </div>
    </div>

    <div id="playingScreen" class="container" style="display: none;">
        <div class="content-wrapper">
            <h1 id="playStatusTitle" style="color: #cf9366;">音檔下載中...</h1>
            <p id="playStatusDesc" style="color: #a39589; font-weight: bold;">請確保手機音量已開啟</p>
            <div id="countdownNumber">--</div>
        </div>
    </div>

    <div id="votingScreen" class="container" style="display: none;">
        <div class="content-wrapper">
            <h1 style="color: #e07a5f;">討論與投票</h1>
            <p style="color: #a39589; font-weight: bold; margin: 0;">點擊頭像抓出臥底，再點可取消</p>
            <div id="voteTimer">20</div>
            <div id="voteGrid" class="vote-grid"></div>
        </div>
    </div>

    <div id="resultScreen" class="container" style="display: none;">
        <div class="content-wrapper">
            <h1 id="resultTitle">--</h1>
            <p style="font-size: 18px; color: #a39589; font-weight: bold; margin-bottom: 20px;">本局臥底是：<span id="resultSpy" style="color: #cf9366; font-size: 24px;">--</span></p>
            
            <div class="song-reveal-box">
                <div style="font-size: 14px; color: #a39589; margin-bottom: 8px;">
                    🎵 平民聽的歌：<br>
                    <span id="resultCivilianSong" style="color: #7a6a5d; font-weight: bold; font-size: 16px;">--</span>
                </div>
                <div style="font-size: 14px; color: #a39589;">
                    🎧 臥底聽的歌：<br>
                    <span id="resultUndercoverSong" style="color: #cf9366; font-weight: bold; font-size: 16px;">--</span>
                </div>
            </div>

            <p style="font-size: 16px; color: #7a6a5d; background: #faf8f5; padding: 10px; border-radius: 10px; margin-bottom: 20px;">
                被淘汰的玩家：<br><span id="resultEliminated">--</span>
            </p>

            <button class="btn-secondary" style="width: 100%;" onclick="switchView('roomScreen')">返回房間</button>
        </div>
    </div>

    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <div id="modalMsg" class="modal-msg"></div>
            <div class="modal-btns">
                <button id="modalBtnYes" class="btn-danger">是</button>
                <button id="modalBtnNo" class="btn-secondary">否</button>
                <button id="modalBtnOk" class="btn-secondary" style="display: none;">確定</button>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-msg">房間設定</div>
            <span class="label">播放秒數</span>
            <select id="selectDuration">
                <option value="15">15 秒</option>
                <option value="20">20 秒</option>
                <option value="25">25 秒</option>
                <option value="30">30 秒</option>
            </select>
            <span class="label">題庫歌單</span>
            <select id="selectCategory">
                <option value="華語流行">華語流行</option>
                <option value="K-POP">K-POP</option>
                <option value="動漫神曲">動漫神曲</option>
                <option value="流行英語">流行英語</option>
                <option value="混合隨機" selected>混合隨機</option>
            </select>
            <div class="modal-btns">
                <button class="btn-secondary" onclick="document.getElementById('settingsModal').style.display='none'">取消</button>
                <button class="btn-danger" onclick="saveSettings()">確認</button>
            </div>
        </div>
    </div>

    <audio id="bgm" preload="auto"></audio>

    <script>
        const socket = io();
        let myUserId = localStorage.getItem('music_spy_uid') || ('USER_' + Math.random().toString(36).substr(2, 9));
        localStorage.setItem('music_spy_uid', myUserId);
        document.getElementById('nameInput').value = localStorage.getItem('music_spy_name') || '';
        let currentRoomId = null;
        let playTimer = null;
        let voteTimer = null;
        let myVoteTarget = null;
        let globalPlayers = {}; 

        function showConfirm(msg, onYes) {
            document.getElementById('modalMsg').innerText = msg;
            document.getElementById('modalBtnYes').style.display = 'block';
            document.getElementById('modalBtnNo').style.display = 'block';
            document.getElementById('modalBtnOk').style.display = 'none';
            document.getElementById('customModal').style.display = 'flex';
            document.getElementById('modalBtnYes').onclick = () => { document.getElementById('customModal').style.display='none'; if(onYes) onYes(); };
            document.getElementById('modalBtnNo').onclick = () => { document.getElementById('customModal').style.display='none'; };
        }
        function showAlert(msg, onOk) {
            document.getElementById('modalMsg').innerText = msg;
            document.getElementById('modalBtnYes').style.display = 'none';
            document.getElementById('modalBtnNo').style.display = 'none';
            document.getElementById('modalBtnOk').style.display = 'block';
            document.getElementById('customModal').style.display = 'flex';
            document.getElementById('modalBtnOk').onclick = () => { document.getElementById('customModal').style.display='none'; if(onOk) onOk(); };
        }
        function switchView(viewId) {
            ['homeScreen', 'roomScreen', 'playingScreen', 'votingScreen', 'resultScreen'].forEach(id => {
                document.getElementById(id).style.display = (id === viewId) ? 'block' : 'none';
            });
        }

        function getMyName() {
            let name = document.getElementById('nameInput').value.trim();
            if (name === "") name = "天飛巴庫";
            localStorage.setItem('music_spy_name', name);
            return name;
        }

        function createRoom() { socket.emit('create_room', { userId: myUserId, userName: getMyName() }); }
        function joinRoom() {
            const inputRoomId = document.getElementById('roomInput').value.trim().toUpperCase();
            if (!inputRoomId) return showAlert("請輸入房間碼！");
            socket.emit('join_room', { roomId: inputRoomId, userId: myUserId, userName: getMyName() });
        }
        function leaveRoom() {
            if (!currentRoomId) return;
            showConfirm(`確定要${document.getElementById('leaveBtn').innerText}嗎？`, () => {
                socket.emit('leave_room', { roomId: currentRoomId, userId: myUserId });
                currentRoomId = null;
                switchView('homeScreen');
            });
        }

        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function saveSettings() {
            const d = document.getElementById('selectDuration').value;
            const c = document.getElementById('selectCategory').value;
            socket.emit('update_settings', { roomId: currentRoomId, userId: myUserId, settings: { duration: parseInt(d), category: c } });
            document.getElementById('settingsModal').style.display = 'none';
        }

        socket.on('error_msg', showAlert);
        socket.on('room_destroyed', () => { showAlert("房主已解散房間！", () => { currentRoomId = null; switchView('homeScreen'); }); });
        socket.on('room_joined', (roomId) => { currentRoomId = roomId; switchView('roomScreen'); });

        socket.on('room_state_update', (roomState) => {
            if (!currentRoomId) return;
            if (document.getElementById('playingScreen').style.display === 'block' || document.getElementById('votingScreen').style.display === 'block') return; 
            
            document.getElementById('displayRoomId').innerText = '房間：' + currentRoomId;
            document.getElementById('displaySettings').innerText = `設定：${roomState.settings.duration}秒 | ${roomState.settings.category}`;
            document.getElementById('selectDuration').value = roomState.settings.duration;
            document.getElementById('selectCategory').value = roomState.settings.category;

            const listDiv = document.getElementById('playerList');
            listDiv.innerHTML = ''; 
            let allReady = true; 
            let index = 1; 
            globalPlayers = roomState.players; 
            
            const isHost = (roomState.hostId === myUserId);
            document.getElementById('leaveBtn').innerText = isHost ? '解散房間' : '退出房間';
            document.getElementById('settingBtn').style.display = isHost ? 'inline-block' : 'none';
            
            for (const uid in roomState.players) {
                const p = roomState.players[uid];
                const hostText = (uid === roomState.hostId) ? '(房主)' : '';
                let statusText = p.status !== 'ONLINE' ? '<span style="color: #e07a5f;">斷線中</span>' : 
                                 p.isReady ? '<span style="color: #9cbca7;">準備完成</span>' : '<span style="color: #c7bcae;">準備中</span>';
                if (p.status === 'ONLINE' && !p.isReady) allReady = false; 
                listDiv.innerHTML += `<div class="player-list-item">${index} - ${p.name}${hostText} - ${statusText}</div>`;
                index++;
            }

            document.getElementById('startBtn').style.display = (isHost && allReady && Object.keys(roomState.players).length > 1) ? 'inline-block' : 'none';
        });

        function toggleReady() {
            if (!currentRoomId) return;
            const audio = document.getElementById('bgm');
            audio.play().then(() => { audio.pause(); }).catch(e => console.warn("音訊解鎖失敗"));
            socket.emit('toggle_ready', { roomId: currentRoomId, userId: myUserId });
        }
        function startGame() { socket.emit('start_game', { roomId: currentRoomId, userId: myUserId }); }

        socket.on('game_starting', () => {
            switchView('playingScreen');
            document.getElementById('playStatusTitle').innerText = '音檔下載中...';
            document.getElementById('playStatusDesc').innerText = '請確保手機音量開啟';
            document.getElementById('countdownNumber').innerText = '--';
        });

        socket.on('PRELOAD_MUSIC', (url) => {
            const audio = document.getElementById('bgm');
            audio.src = url; audio.load();
            audio.oncanplaythrough = () => {
                audio.oncanplaythrough = null; 
                document.getElementById('playStatusTitle').innerText = '下載完成';
                document.getElementById('playStatusDesc').innerText = '等待其他人載入...';
                socket.emit('music_loaded', { roomId: currentRoomId, userId: myUserId });
            };
        });

        socket.on('START_PLAYING', (duration) => {
            document.getElementById('playStatusTitle').innerText = '仔細聽！';
            document.getElementById('playStatusDesc').innerText = '找出那個音樂不一樣的騙子';
            
            const audio = document.getElementById('bgm');
            audio.currentTime = 0; 
            audio.play().catch(e => console.error(e));
            
            let timeLeft = duration;
            document.getElementById('countdownNumber').innerText = timeLeft;
            playTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('countdownNumber').innerText = timeLeft;
                if(timeLeft <= 0) { clearInterval(playTimer); audio.pause(); }
            }, 1000);
        });

        socket.on('START_VOTING', () => {
            switchView('votingScreen');
            myVoteTarget = null;
            
            const grid = document.getElementById('voteGrid');
            grid.innerHTML = '';
            for (const uid in globalPlayers) {
                const btn = document.createElement('button');
                btn.className = 'vote-btn';
                btn.innerText = globalPlayers[uid].name;
                btn.onclick = () => handleVoteClick(uid, btn);
                grid.appendChild(btn);
            }

            let vTime = 20; 
            document.getElementById('voteTimer').innerText = vTime;
            voteTimer = setInterval(() => {
                vTime--;
                document.getElementById('voteTimer').innerText = vTime;
                if(vTime <= 0) clearInterval(voteTimer);
            }, 1000);
        });

        function handleVoteClick(uid, btnElement) {
            if (myVoteTarget === uid) {
                myVoteTarget = null;
                btnElement.classList.remove('selected');
            } else {
                myVoteTarget = uid;
                document.querySelectorAll('.vote-btn').forEach(b => b.classList.remove('selected'));
                btnElement.classList.add('selected');
            }
            socket.emit('submit_vote', { roomId: currentRoomId, userId: myUserId, targetId: myVoteTarget });
        }

        // 👇 結算畫面的動態渲染邏輯在這裡 👇
        socket.on('GAME_RESULT', ({ winner, eliminatedData, undercoverName, civilianSong, undercoverSong }) => {
            switchView('resultScreen');
            
            const title = document.getElementById('resultTitle');
            title.innerText = winner;
            title.style.color = (winner === '平民勝利') ? '#9cbca7' : '#e07a5f';
            
            document.getElementById('resultSpy').innerText = undercoverName;
            document.getElementById('resultCivilianSong').innerText = civilianSong;
            document.getElementById('resultUndercoverSong').innerText = undercoverSong;

            // 判斷淘汰者陣列，組合出帶顏色的 HTML 字串
            let eliminatedHtml = '';
            if (!eliminatedData || eliminatedData.length === 0) {
                eliminatedHtml = '<span style="color: #a39589;">無人被淘汰</span>';
            } else {
                eliminatedHtml = eliminatedData.map(p => {
                    const fontColor = p.isUndercover ? '#e07a5f' : '#9cbca7'; // 臥底紅，平民綠
                    return `<span class="eliminated-name" style="color: ${fontColor};">${p.name}</span>`;
                }).join('<span style="color: #7a6a5d;">, </span>');
            }
            document.getElementById('resultEliminated').innerHTML = eliminatedHtml;
        });
    </script>
</body>
</html>
