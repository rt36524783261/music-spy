<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音樂臥底</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f4ece1; color: #4a4036; font-family: 'Noto Sans TC', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        /* 💡 容器寬度放大至 540px，給按鈕與文字更多呼吸空間 */
        .container { 
            background-color: #ffffff; 
            background-image: radial-gradient(#f0e9df 1px, transparent 1px);
            background-size: 16px 16px;
            padding: 35px 30px; border-radius: 24px; width: 90%; max-width: 540px; 
            box-shadow: 0 15px 35px rgba(139, 115, 85, 0.12), inset 0 1px 0 rgba(255,255,255,0.8); 
            text-align: center; position: relative; overflow: hidden; 
            border: 2px solid #eae2d5;
        }
        .container::before { content: ''; position: absolute; top: -40px; left: -40px; width: 140px; height: 140px; background-color: #fff5eb; border-radius: 50%; z-index: 0; }
        .container::after { content: ''; position: absolute; bottom: -30px; right: -30px; width: 100px; height: 100px; background-color: #f0f4f1; border-radius: 50%; z-index: 0; }
        .content-wrapper { position: relative; z-index: 1; }

        h1 { margin-top: 0; margin-bottom: 20px; color: #6b5b4e; font-weight: 900; letter-spacing: 2px; }
        .label { font-size: 14px; font-weight: bold; color: #a39589; margin-bottom: 10px; display: block; }
        input, select { padding: 14px; font-size: 16px; width: 80%; margin-bottom: 20px; border-radius: 12px; border: 2px solid #f2ede4; background: #faf8f5; color: #5a4b41; text-align: center; font-weight: bold; transition: all 0.3s; }
        input:focus, select:focus { outline: none; border-color: #e3a87c; background: #ffffff; }

        button { padding: 14px 24px; font-size: 16px; font-weight: 700; margin: 10px 5px; cursor: pointer; border-radius: 12px; border: none; background-color: #e3a87c; color: white; box-shadow: 0 4px 12px rgba(227, 168, 124, 0.3); transition: all 0.2s; white-space: nowrap; }
        button:hover { background-color: #cf9366; transform: translateY(-2px); }
        .btn-secondary { background-color: #9cbca7; box-shadow: 0 4px 12px rgba(156, 188, 167, 0.3); }
        .btn-secondary:hover { background-color: #84a690; }
        .btn-danger { background-color: #e07a5f; box-shadow: 0 4px 12px rgba(224, 122, 95, 0.3); }
        .btn-danger:hover { background-color: #c9654b; }
        
        .btn-disabled { background-color: #d3c9c1 !important; color: #ffffff !important; box-shadow: none !important; cursor: not-allowed !important; transform: none !important; }
        
        .btn-outline { background-color: transparent; border: 2px solid #e07a5f; color: #e07a5f; box-shadow: none; font-size: 13px; padding: 6px 10px; white-space: nowrap; }
        .btn-outline:hover { background-color: #e07a5f; color: white; }
        .btn-setting { border: 2px solid #9cbca7; color: #9cbca7; }
        .btn-setting:hover { background-color: #9cbca7; color: white; }
        .btn-rank { border: 2px solid #cf9366; color: #cf9366; }
        .btn-rank:hover { background-color: #cf9366; color: white; }
        .btn-history { border: 2px solid #a39589; color: #a39589; }
        .btn-history:hover { background-color: #a39589; color: white; }
        
        .btn-kick { background-color: #e07a5f; color: white; border: none; padding: 4px 10px; font-size: 12px; border-radius: 8px; margin-left: 10px; cursor: pointer; box-shadow: none; }
        .btn-kick:hover { background-color: #c9654b; transform: none; }

        /* 💡 頂部按鈕列優化：支援完整雙向滑動，預設左側對齊不被卡住 */
        .header-btns { 
            display: flex; justify-content: flex-start; flex-wrap: nowrap; align-items: center; 
            width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; 
            gap: 6px; padding: 4px 2px 8px 2px; scrollbar-width: thin;
        }

        .room-header { border-bottom: 2px dashed #f2ede4; padding-bottom: 15px; margin-bottom: 20px; display: flex; flex-direction: column; align-items: center;}
        #displayRoomId { font-size: 32px; font-weight: 900; color: #cf9366; margin: 0 0 10px 0; letter-spacing: 4px;}
        .room-settings-info { width: 100%; font-size: 14px; color: #a39589; margin-top: 10px; font-weight: bold; }
        
        .player-list-item { font-size: 16px; font-weight: bold; padding: 12px 15px; margin: 8px 0; background: #faf8f5; border-radius: 12px; color: #7a6a5d; border: 1px solid #f2ede4; display: flex; justify-content: space-between; align-items: center; overflow: hidden; }
        
        .player-info-left { display: flex; align-items: center; flex: 1; min-width: 0; margin-right: 10px; }
        .player-name-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
        .player-status-right { white-space: nowrap; flex-shrink: 0; display: flex; align-items: center; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(74, 64, 54, 0.6); z-index: 999; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
        .modal-box { background: white; padding: 30px; border-radius: 20px; width: 85%; max-width: 380px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); text-align: center; max-height: 80vh; display: flex; flex-direction: column; }
        .modal-msg { margin-bottom: 20px; font-size: 18px; font-weight: bold; color: #6b5b4e; }
        .modal-btns { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }

        .rank-list-container { overflow-y: auto; flex: 1; text-align: left; }
        .rank-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f2ede4; font-size: 15px; font-weight: bold; color: #7a6a5d; }
        .rank-item:last-child { border-bottom: none; }
        .rank-name-box { flex: 1; min-width: 0; margin-right: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
        .rank-score-box { flex-shrink: 0; color: #cf9366; font-size: 16px; }

        /* 💡 替代方案 1：復古錄音帶 (Cassette Tape) 視覺元件與旋轉動畫 */
        .cassette-container {
            width: 180px; height: 100px; margin: 15px auto;
            background: #4a4036; border-radius: 12px; position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15); border: 3px solid #6b5b4e;
            display: flex; flex-direction: column; justify-content: space-between; padding: 10px;
        }
        .cassette-window {
            width: 110px; height: 42px; background: #faf8f5; margin: 0 auto; border-radius: 6px;
            border: 2px solid #b8a99a; display: flex; justify-content: space-around; align-items: center; position: relative;
        }
        .cassette-spool {
            width: 28px; height: 28px; border: 3px dashed #6b5b4e; border-radius: 50%;
        }
        .cassette-container.spinning .cassette-spool {
            animation: spinSpool 2s linear infinite;
        }
        @keyframes spinSpool {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .cassette-label {
            font-size: 11px; font-weight: bold; color: white; text-align: center; background: #e3a87c; padding: 2px 6px; border-radius: 4px;
        }

        /* 💡 0% 到 100% 時間進度條 */
        .progress-bar-container {
            width: 100%; height: 10px; background: #f2ede4; border-radius: 5px;
            margin: 15px 0 5px 0; overflow: hidden; border: 1px solid #eaddcc;
        }
        .progress-bar-fill {
            width: 0%; height: 100%; background: #9cbca7; border-radius: 5px;
            transition: width 0.2s linear, background-color 0.3s;
        }

        #countdownNumber, #voteTimer { font-size: 60px; font-weight: 900; color: #e07a5f; text-shadow: 2px 4px 10px rgba(224, 122, 95, 0.2); margin: 10px 0; }
        .vote-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .vote-btn { padding: 15px; background: #faf8f5; border: 2px solid #f2ede4; border-radius: 12px; font-size: 16px; font-weight: bold; color: #7a6a5d; cursor: pointer; transition: 0.2s; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; position: relative; }
        .vote-btn.selected { background: #e07a5f; color: white; border-color: #c9654b; transform: scale(1.05); }

        #resultTitle { font-size: 32px; font-weight: 900; margin-bottom: 15px; }
        
        .song-reveal-box { background: #faf8f5; border: 1px solid #f2ede4; border-radius: 12px; padding: 15px; margin-bottom: 15px; text-align: left; }
        .eliminated-name { font-weight: bold; }

        #toast { visibility: hidden; min-width: 150px; max-width: 80%; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 10px; position: fixed; z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 14px; opacity: 0; transition: opacity 0.3s, bottom 0.3s; word-wrap: break-word; font-weight: bold; }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }

        #downloadList { margin-top: 20px; text-align: left; background: #faf8f5; border-radius: 12px; padding: 15px; border: 1px solid #f2ede4; max-height: 200px; overflow-y: auto; }
        .dl-item { font-weight: bold; color: #7a6a5d; margin: 8px 0; display: flex; justify-content: space-between; border-bottom: 1px dashed #eaddcc; padding-bottom: 5px;}
        .dl-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0;}
    </style>
</head>
<body>
    
    <div id="homeScreen" class="container">
        <div class="content-wrapper">
            <h1>音樂臥底</h1>
            <span class="label">輸入暱稱</span>
            <input type="text" id="nameInput" placeholder="預設: 天飛巴庫">
            <div style="margin-top: 5px;"><button onclick="createRoom()">建立房間</button></div>
            <hr style="border: none; border-top: 2px dashed #f2ede4; margin: 30px 0;">
            <div style="display: flex; justify-content: center; gap: 10px; align-items: center;">
                <input type="number" id="roomInput" placeholder="輸入4碼房號" style="width: 55%; margin-bottom: 0;" inputmode="numeric" maxlength="4">
                <button class="btn-secondary" style="margin: 0; white-space: nowrap;" onclick="joinRoom()">加入房間</button>
            </div>
        </div>
    </div>

    <div id="roomScreen" class="container" style="display: none;">
        <div class="content-wrapper">
            <div class="room-header">
                <div class="label">房間代碼</div>
                <div id="displayRoomId">----</div>
                <div class="header-btns">
                    <button class="btn-outline btn-history btn-sm" onclick="openHistoryModal()">歷史歌單</button>
                    <button class="btn-outline btn-rank btn-sm" onclick="openRankModal()">玩家排行</button>
                    <button id="settingBtn" class="btn-outline btn-setting btn-sm" style="display: none;" onclick="openSettings()">遊戲設定</button>
                    <button id="leaveBtn" class="btn-outline btn-sm" onclick="leaveRoom()">退出房間</button>
                </div>
                <div class="room-settings-info" id="displaySettings">設定：15秒 | 混合隨機</div>
            </div>
            <div id="playerList" style="margin: 20px 0; min-height: 150px;"></div>
            
            <div style="margin-top: 30px; display: flex; justify-content: center; gap: 10px; align-items: center;">
                <button id="readyBtn" onclick="toggleReady()">準備 / 取消</button>
                <button id="startBtn" class="btn-danger btn-disabled" style="display: none;" disabled onclick="startGame()">開始遊戲</button>
            </div>
        </div>
    </div>

    <div id="playingScreen" class="container" style="display: none;">
        <div class="content-wrapper">
            <h1 id="playStatusTitle" style="color: #cf9366;">音檔下載中...</h1>
            <p id="playStatusDesc" style="color: #a39589; font-weight: bold;">請確保手機音量已開啟</p>
            
            <!-- 💡 復古錄音帶動畫元件 -->
            <div id="cassetteWrapper" style="display: none;">
                <div class="cassette-container" id="cassetteBox">
                    <div class="cassette-label" id="cassetteLabelText">音樂臥底</div>
                    <div class="cassette-window">
                        <div class="cassette-spool"></div>
                        <div class="cassette-spool"></div>
                    </div>
                </div>
            </div>

            <!-- 💡 0% 到 100% 時間進度條 -->
            <div id="progressContainer" style="display: none;">
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
            </div>

            <div id="countdownNumber" style="display: none;">--</div>
            <div id="downloadList" style="display: none;"></div>
        </div>
    </div>

    <div id="votingScreen" class="container" style="display: none;">
        <div class="content-wrapper">
            <h1 style="color: #e07a5f;">討論與投票</h1>
            <p id="voteStatusHint" style="color: #a39589; font-weight: bold; margin: 0;">點擊頭像抓出臥底，再點可取消 (已投: 0/0)</p>
            <div id="voteTimer">--</div>
            <div id="voteGrid" class="vote-grid"></div>
        </div>
    </div>

    <div id="resultScreen" class="container" style="display: none;">
        <div class="content-wrapper">
            <h1 id="resultTitle">--</h1>
            <p style="font-size: 18px; color: #a39589; font-weight: bold; margin-bottom: 20px;">本局臥底是：<span id="resultSpy" style="color: #e07a5f; font-size: 24px;">--</span></p>
            
            <div class="song-reveal-box">
                <div style="font-size: 14px; color: #a39589; margin-bottom: 8px;">🎵 平民聽的歌：<br><span id="resultCivilianSong" style="color: #7a6a5d; font-weight: bold; font-size: 16px;">--</span></div>
                <!-- 💡 臥底聽的歌顏色改為與平民一致的深灰色 -->
                <div style="font-size: 14px; color: #a39589;">🎧 臥底聽的歌：<br><span id="resultUndercoverSong" style="color: #7a6a5d; font-weight: bold; font-size: 16px;">--</span></div>
            </div>

            <p style="font-size: 16px; color: #7a6a5d; background: #faf8f5; padding: 10px; border-radius: 10px; margin-bottom: 20px;">
                被淘汰的玩家：<br><span id="resultEliminated">--</span>
            </p>

            <button class="btn-secondary" style="width: 100%;" onclick="switchView('roomScreen')">返回房間</button>
        </div>
    </div>

    <!-- 歷史歌單 Modal -->
    <div id="historyModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-msg">📜 歷史歌單回顧</div>
            <div id="historyListContainer" class="rank-list-container"></div>
            <div class="modal-btns">
                <button class="btn-secondary" onclick="document.getElementById('historyModal').style.display='none'">關閉</button>
            </div>
        </div>
    </div>

    <div id="rankModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-msg">🏆 玩家排行榜</div>
            <div id="rankListContainer" class="rank-list-container"></div>
            <div class="modal-btns">
                <button class="btn-secondary" onclick="document.getElementById('rankModal').style.display='none'">關閉</button>
            </div>
        </div>
    </div>

    <div id="customModal" class="modal-overlay">
        <div class="modal-box" style="display:block;">
            <div id="modalMsg" class="modal-msg"></div>
            <div class="modal-btns">
                <button id="modalBtnYes" class="btn-danger">是</button>
                <button id="modalBtnNo" class="btn-secondary">否</button>
                <button id="modalBtnOk" class="btn-secondary" style="display: none;">確定</button>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="modal-overlay">
        <div class="modal-box" style="display:block;">
            <div class="modal-msg">房間設定</div>
            <span class="label">播放秒數</span>
            <select id="selectDuration">
                <option value="15">15 秒</option>
                <option value="20">20 秒</option>
                <option value="25">25 秒</option>
                <option value="30">30 秒</option>
            </select>
            <span class="label">題庫歌單</span>
            <select id="selectCategory">
                <option value="華語流行">華語流行</option>
                <option value="K-POP">K-POP</option>
                <option value="動漫神曲">動漫神曲</option>
                <option value="流行英語">流行英語</option>
                <option value="混合隨機" selected>混合隨機</option>
            </select>
            <div class="modal-btns">
                <button class="btn-secondary" onclick="document.getElementById('settingsModal').style.display='none'">取消</button>
                <button class="btn-danger" onclick="saveSettings()">確認</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>
    <audio id="bgm" preload="auto"></audio>

    <script>
        const socket = io();
        let myUserId = sessionStorage.getItem('music_spy_uid') || ('USER_' + Math.random().toString(36).substr(2, 9));
        sessionStorage.setItem('music_spy_uid', myUserId);
        document.getElementById('nameInput').value = sessionStorage.getItem('music_spy_name') || '';
        let currentRoomId = null;
        let globalTimerInterval = null; 
        let myVoteTarget = null;
        let globalPlayers = {}; 
        let globalScores = {}; 
        let globalHistoryList = [];
        let globalSettingsDuration = 15;
        let lastTickSecond = -1;

        let audioCtx = null;
        function playWoodblockTick() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(850, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
                
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {
                console.warn("音效播放失敗:", e);
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && currentRoomId) {
                socket.emit('go_background', { roomId: currentRoomId, userId: myUserId });
            } else if (!document.hidden && currentRoomId) {
                socket.emit('wake_up', { roomId: currentRoomId, userId: myUserId });
            }
        });

        socket.on('connect', () => {
            if (currentRoomId) {
                socket.emit('join_room', { roomId: currentRoomId, userId: myUserId, userName: getMyName() });
            }
        });

        function showToast(text) {
            const toast = document.getElementById("toast");
            toast.innerText = text;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2500);
        }

        function showConfirm(msg, onYes) {
            document.getElementById('modalMsg').innerText = msg;
            document.getElementById('modalBtnYes').style.display = 'block';
            document.getElementById('modalBtnNo').style.display = 'block';
            document.getElementById('modalBtnOk').style.display = 'none';
            document.getElementById('customModal').style.display = 'flex';
            document.getElementById('modalBtnYes').onclick = () => { document.getElementById('customModal').style.display='none'; if(onYes) onYes(); };
            document.getElementById('modalBtnNo').onclick = () => { document.getElementById('customModal').style.display='none'; };
        }
        function showAlert(msg, onOk) {
            document.getElementById('modalMsg').innerText = msg;
            document.getElementById('modalBtnYes').style.display = 'none';
            document.getElementById('modalBtnNo').style.display = 'none';
            document.getElementById('modalBtnOk').style.display = 'block';
            document.getElementById('customModal').style.display = 'flex';
            document.getElementById('modalBtnOk').onclick = () => { document.getElementById('customModal').style.display='none'; if(onOk) onOk(); };
        }
        function switchView(viewId) {
            ['homeScreen', 'roomScreen', 'playingScreen', 'votingScreen', 'resultScreen'].forEach(id => {
                document.getElementById(id).style.display = (id === viewId) ? 'block' : 'none';
            });
        }

        function startGlobalTimer(remainingMs, elementId, isPlayingPhase = false) {
            clearInterval(globalTimerInterval);
            if (!remainingMs) return;

            const el = document.getElementById(elementId);
            const audio = document.getElementById('bgm');
            const localEndTime = Date.now() + remainingMs;
            const totalDurationMs = isPlayingPhase ? (globalSettingsDuration * 1000) : 20000;
            lastTickSecond = -1;
            
            const updateTimer = () => {
                const now = Date.now();
                let remainMs = localEndTime - now;
                let remainSec = Math.ceil(remainMs / 1000);
                if (remainSec <= 0) {
                    remainSec = 0;
                    clearInterval(globalTimerInterval);
                    if (isPlayingPhase && audio && !audio.paused) {
                        audio.pause();
                    }
                }
                el.innerText = remainSec;

                if (remainSec > 0 && remainSec <= 3 && remainSec !== lastTickSecond) {
                    playWoodblockTick();
                    lastTickSecond = remainSec;
                }

                if (isPlayingPhase) {
                    let elapsed = totalDurationMs - remainMs;
                    let percent = Math.min(100, Math.max(0, (elapsed / totalDurationMs) * 100));
                    const fillEl = document.getElementById('progressBarFill');
                    if (fillEl) {
                        fillEl.style.width = percent + '%';
                        fillEl.style.backgroundColor = percent > 80 ? '#e07a5f' : '#9cbca7';
                    }
                }
            };
            updateTimer();
            globalTimerInterval = setInterval(updateTimer, 100);
        }

        function getMyName() {
            let name = document.getElementById('nameInput').value.trim();
            if (name === "") name = "天飛巴庫";
            sessionStorage.setItem('music_spy_name', name);
            return name;
        }

        function createRoom() { socket.emit('create_room', { userId: myUserId, userName: getMyName() }); }
        function joinRoom() {
            const inputRoomId = document.getElementById('roomInput').value.trim();
            if (!inputRoomId) return showAlert("請輸入房間碼！");
            socket.emit('join_room', { roomId: inputRoomId, userId: myUserId, userName: getMyName() });
        }
        function leaveRoom() {
            if (!currentRoomId) return;
            showConfirm(`確定要${document.getElementById('leaveBtn').innerText}嗎？`, () => {
                socket.emit('leave_room', { roomId: currentRoomId, userId: myUserId });
                currentRoomId = null;
                switchView('homeScreen');
            });
        }

        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function saveSettings() {
            const d = document.getElementById('selectDuration').value;
            const c = document.getElementById('selectCategory').value;
            socket.emit('update_settings', { roomId: currentRoomId, userId: myUserId, settings: { duration: parseInt(d), category: c } });
            document.getElementById('settingsModal').style.display = 'none';
        }

        function openRankModal() {
            const container = document.getElementById('rankListContainer');
            container.innerHTML = '';
            const sortedPlayerIds = Object.keys(globalPlayers).sort((a, b) => {
                return (globalScores[b] || 0) - (globalScores[a] || 0); 
            });

            let rankIndex = 1;
            sortedPlayerIds.forEach(uid => {
                const p = globalPlayers[uid];
                const score = globalScores[uid] || 0;
                container.innerHTML += `
                    <div class="rank-item">
                        <div class="rank-name-box" onclick="showToast('${p.name}')">
                            <span style="color: #9cbca7; margin-right: 5px;">#${rankIndex}</span>${p.name}
                        </div>
                        <div class="rank-score-box">${score} 分</div>
                    </div>`;
                rankIndex++; 
            });
            document.getElementById('rankModal').style.display = 'flex';
        }

        function openHistoryModal() {
            const container = document.getElementById('historyListContainer');
            container.innerHTML = '';
            if (!globalHistoryList || globalHistoryList.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #a39589; font-weight: bold;">目前尚無歷史歌單紀錄</div>';
            } else {
                globalHistoryList.forEach(h => {
                    container.innerHTML += `
                        <div class="rank-item" style="flex-direction: column; align-items: flex-start;">
                            <div style="font-size: 13px; color: #a39589; margin-bottom: 4px;">第 ${h.round} 局 (${h.category}) - 勝者：<span style="color: #e07a5f;">${h.winner}</span></div>
                            <div style="font-size: 14px; color: #7a6a5d;">🎵 平民：${h.civilianSong}</div>
                            <div style="font-size: 14px; color: #7a6a5d;">🎧 臥底：${h.undercoverSong}</div>
                        </div>`;
                });
            }
            document.getElementById('historyModal').style.display = 'flex';
        }

        socket.on('error_msg', showAlert);
        
        socket.on('error_to_home', (msg) => {
            showAlert(msg, () => {
                currentRoomId = null;
                switchView('homeScreen');
            });
        });
        
        socket.on('room_destroyed', () => { 
            showAlert("房主已解散房間或閒置過久！", () => { currentRoomId = null; switchView('homeScreen'); }); 
        });

        socket.on('room_joined', (roomId) => { currentRoomId = roomId; switchView('roomScreen'); });

        socket.on('room_state_update', (roomState) => {
            if (!currentRoomId) return;
            globalPlayers = roomState.players; 
            globalScores = roomState.scores; 
            globalHistoryList = roomState.historyList || [];
            globalSettingsDuration = roomState.settings.duration;

            const isResult = document.getElementById('resultScreen').style.display === 'block';
            const isPlayingOrVoting = document.getElementById('playingScreen').style.display === 'block' || document.getElementById('votingScreen').style.display === 'block';

            if (isResult && roomState.state !== 'LOADING') {
                return; 
            }

            if (roomState.state === 'PLAYING') {
                switchView('playingScreen');
                document.getElementById('playStatusTitle').innerText = '仔細聽！';
                document.getElementById('playStatusDesc').innerText = '找出那個音樂不一樣的騙子';
                document.getElementById('downloadList').style.display = 'none';
                document.getElementById('cassetteWrapper').style.display = 'block';
                document.getElementById('cassetteBox').classList.add('spinning');
                document.getElementById('cassetteLabelText').innerText = roomState.settings.category;
                document.getElementById('progressContainer').style.display = 'block';
                document.getElementById('countdownNumber').style.display = 'block';
                
                startGlobalTimer(roomState.phaseRemaining, 'countdownNumber', true);
                return;
            } else if (roomState.state === 'VOTING') {
                switchView('votingScreen');
                
                const audio = document.getElementById('bgm');
                if (audio && !audio.paused) {
                    audio.pause();
                }
                myVoteTarget = null;
                
                renderVoteGrid(roomState.players);
                startGlobalTimer(roomState.phaseRemaining, 'voteTimer', false);
                return;
            } else if (roomState.state === 'LOBBY') {
                if (isPlayingOrVoting) {
                    if (roomState.lastResult) {
                        renderResultScreen(roomState.lastResult);
                        showToast('連線恢復，已為你同步結算畫面');
                        return;
                    } else {
                        switchView('roomScreen');
                    }
                } else if (!isResult) {
                    switchView('roomScreen');
                }
            }

            document.getElementById('displayRoomId').innerText = currentRoomId;
            document.getElementById('displaySettings').innerText = `設定：${roomState.settings.duration}秒 | ${roomState.settings.category}`;
            document.getElementById('selectDuration').value = roomState.settings.duration;
            document.getElementById('selectCategory').value = roomState.settings.category;

            const listDiv = document.getElementById('playerList');
            listDiv.innerHTML = ''; 
            let allReady = true; 
            let index = 1; 
            
            const isHost = (roomState.hostId === myUserId);
            document.getElementById('leaveBtn').innerText = isHost ? '解散房間' : '退出房間';
            document.getElementById('settingBtn').style.display = isHost ? 'inline-block' : 'none';

            Object.keys(roomState.players).forEach(uid => {
                const p = roomState.players[uid];
                const hostText = (uid === roomState.hostId) ? '<span style="font-size: 12px; color: #cf9366; margin-left: 4px;">(房主)</span>' : '';
                let statusText = p.isReady ? '<span style="color: #9cbca7;">準備完成</span>' : '<span style="color: #c7bcae;">準備中</span>';
                if (!p.isReady) allReady = false; 

                let kickButtonHtml = (isHost && uid !== myUserId) ? `<button class="btn-kick" onclick="kickPlayer('${uid}')">踢出</button>` : '';

                listDiv.innerHTML += `
                    <div class="player-list-item">
                        <div class="player-info-left">
                            <span style="margin-right: 5px; flex-shrink: 0;">${index} -</span>
                            <span class="player-name-text" onclick="showToast('${p.name}')">${p.name}</span>
                            <div style="flex-shrink: 0;">${hostText}</div>
                        </div>
                        <div class="player-status-right">${statusText} ${kickButtonHtml}</div>
                    </div>`;
                index++;
            });

            const startBtn = document.getElementById('startBtn');
            if (isHost) {
                startBtn.style.display = 'inline-block';
                const canStart = allReady && Object.keys(roomState.players).length > 1;
                if (canStart) {
                    startBtn.classList.remove('btn-disabled');
                    startBtn.disabled = false;
                } else {
                    startBtn.classList.add('btn-disabled');
                    startBtn.disabled = true;
                }
            } else {
                startBtn.style.display = 'none';
            }
        });

        function kickPlayer(targetUserId) {
            showConfirm("確定要把這傢伙踢出房間嗎？", () => {
                socket.emit('kick_player', { roomId: currentRoomId, targetUserId: targetUserId, hostId: myUserId });
            });
        }

        function toggleReady() {
            if (!currentRoomId) return;
            const audio = document.getElementById('bgm');
            audio.play().then(() => { audio.pause(); }).catch(e => console.warn("音訊解鎖失敗"));
            socket.emit('toggle_ready', { roomId: currentRoomId, userId: myUserId });
        }
        function startGame() { socket.emit('start_game', { roomId: currentRoomId, userId: myUserId }); }

        socket.on('game_starting', () => {
            switchView('playingScreen');
            document.getElementById('playStatusTitle').innerText = '音檔下載中...';
            document.getElementById('playStatusDesc').innerText = '請確保手機音量開啟';
            document.getElementById('cassetteWrapper').style.display = 'none';
            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('countdownNumber').style.display = 'none';
            
            const dlList = document.getElementById('downloadList');
            dlList.style.display = 'block';
            dlList.innerHTML = '';
            for(let uid in globalPlayers) {
                dlList.innerHTML += `
                    <div class="dl-item" id="dl_${uid}">
                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px;">${globalPlayers[uid].name}</span>
                        <span style="color:#e07a5f; flex-shrink: 0;">下載中...</span>
                    </div>`;
            }
        });

        socket.on('PLAYER_LOADED', (uid) => {
            const el = document.getElementById('dl_' + uid);
            if(el && globalPlayers[uid]) {
                el.innerHTML = `
                    <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px;">${globalPlayers[uid].name}</span>
                    <span style="color:#9cbca7; flex-shrink: 0;">已就緒</span>`;
            }
        });

        socket.on('PRELOAD_MUSIC', (url) => {
            const audio = document.getElementById('bgm');
            audio.src = url; audio.load();
            audio.oncanplaythrough = () => {
                audio.oncanplaythrough = null; 
                document.getElementById('playStatusTitle').innerText = '你已下載完成';
                document.getElementById('playStatusDesc').innerText = '等待其他人載入...';
                socket.emit('music_loaded', { roomId: currentRoomId, userId: myUserId });
            };
        });

        socket.on('START_PLAYING_MUSIC', () => {
            const audio = document.getElementById('bgm');
            audio.currentTime = 0; 
            audio.play().catch(e => console.error(e));
        });

        function renderVoteGrid(players) {
            const grid = document.getElementById('voteGrid');
            grid.innerHTML = '';
            for (const uid in players) {
                const btn = document.createElement('button');
                btn.className = 'vote-btn';
                btn.innerText = players[uid].name;
                btn.onclick = () => handleVoteClick(uid, btn);
                if (myVoteTarget === uid) btn.classList.add('selected'); 
                grid.appendChild(btn);
            }
        }

        function handleVoteClick(uid, btnElement) {
            if (myVoteTarget === uid) {
                myVoteTarget = null;
                btnElement.classList.remove('selected');
            } else {
                myVoteTarget = uid;
                document.querySelectorAll('.vote-btn').forEach(b => b.classList.remove('selected'));
                btnElement.classList.add('selected');
            }
            socket.emit('submit_vote', { roomId: currentRoomId, userId: myUserId, targetId: myVoteTarget });
        }

        socket.on('vote_status_update', ({ votedCount, totalCount }) => {
            const hint = document.getElementById('voteStatusHint');
            if (hint) {
                hint.innerText = `點擊頭像抓出臥底，再點可取消 (已投: ${votedCount}/${totalCount})`;
            }
        });

        function renderResultScreen(data) {
            clearInterval(globalTimerInterval);
            myVoteTarget = null; 
            
            switchView('resultScreen');
            
            const title = document.getElementById('resultTitle');
            title.innerText = data.winner;
            title.style.color = (data.winner === '平民勝利') ? '#9cbca7' : '#e07a5f';
            
            // 💡 結算畫面「本局臥底是」名字改為橘紅色
            const spyEl = document.getElementById('resultSpy');
            spyEl.innerText = data.undercoverName;
            spyEl.style.color = '#e07a5f';

            document.getElementById('resultCivilianSong').innerText = data.civilianSong;
            document.getElementById('resultUndercoverSong').innerText = data.undercoverSong;

            let eliminatedHtml = '';
            if (!data.eliminatedData || data.eliminatedData.length === 0) {
                eliminatedHtml = '<span style="color: #a39589;">無人被淘汰</span>';
            } else {
                eliminatedHtml = data.eliminatedData.map(p => {
                    const fontColor = p.isUndercover ? '#e07a5f' : '#9cbca7'; 
                    return `<span class="eliminated-name" style="color: ${fontColor};">${p.name}</span>`;
                }).join('<span style="color: #7a6a5d;">, </span>');
            }
            document.getElementById('resultEliminated').innerHTML = eliminatedHtml;
        }

        socket.on('GAME_RESULT', renderResultScreen);
    </script>
</body>
</html>
